project_id = "oyewjuvpnavwhmdiqfve"

[api]
enabled = true
port = 54321
# Must stay in step with the hosted project's Settings -> API -> Exposed schemas.
# Production currently exposes: public, graphql_public, inventory, budget.
# `inventory` belongs to the separate inventory app and was missing from this
# file; `church` must be ADDED in the Dashboard after the migrations apply, or
# every supabase.schema("church") call returns 404 PGRST106.
schemas = ["public", "graphql_public", "inventory", "budget", "church"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"
max_header_length = 4096

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
inspector_port = 8083

[analytics]
enabled = false
port = 54327

[functions.create-user]
verify_jwt = true

[functions.import-users]
verify_jwt = true

[functions.send-auth-email]
verify_jwt = false

[functions.send-event-notification]
verify_jwt = false

[functions.send-budget-notification]
verify_jwt = false

[functions.handle-workflow-notification]
verify_jwt = false

[functions.send-connect-message]
verify_jwt = false

# Drains church.notification_log. Invoked by pg_cron via pg_net, which sends
# the service-role key as a bearer token rather than a user JWT.
[functions.send-kids-notification]
verify_jwt = false
